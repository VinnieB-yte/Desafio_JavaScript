    <main>
        <div class="forms">
            <div>
                <img src="img/xls 2.2 diesel.jpg">
            </div>
            <div>
                <h2 class="titulo">Sobre Você</h2>
            <form onsubmit="Post(this);">
                <input type="text" name="nome" placeholder="NOME*" class="fordform" required>
                <input type="email" name="email" placeholder="E-MAIL*" class="fordform" required>
                <input type="number" name="cpf" placeholder="CPF*" class="fordform" required>
                <input type="text" name="sobrenome" placeholder="SOBRENOME*" class="fordform" required>
                <input type="number" name="telefone" placeholder="TELEFONE*" class="fordform" required>
                <select name="contato" class="fordform" required>
                    <option selected>COMO DESEJA SER CONTATADO</option>
                    <option>TELEFONE</option>
                    <option>E-MAIL</option>
                </select>
                <div class="divForm">
                <p>Os dados serão mantidos em nossa base de dados, só enquanto for desejado por você. A
                    qualquer momento, será possível editar ou remover tais dados. <a href="https://www.ford.com.br/politica-de-privacidade/
                ">Termos e Condições.</a></p>
                <br>
                <input type="checkbox" id="termos" onchange="validarTermos()">
                <label for="">Sim. Li e concordo com os Termos e Condições. </label>
                <br>
                <input type="checkbox" id="descontos" disabled>
                <label for=""> Sim. Também quero receber descontos e novidades. </label>
                </div>
                <br>
            <button type="submit" id="btnEnviar" disabled>Enviar</button>
            </form>
